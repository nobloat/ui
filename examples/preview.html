<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nobloat/ui · preview</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../ui.css">
<!-- Demo only: one page as desktop and as phone, side by side. Navigating in one frame moves the other. -->
<style>
  body { max-width: none; padding: .8rem 16px; height: 100vh; display: flex; flex-direction: column; gap: .8rem; }
  .ctl { flex: none; display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; font-size: .85rem; }
  .ctl .lab { color: var(--muted); }
  .ctl > label { display: inline-flex; gap: .4rem; align-items: center; color: var(--muted); }
  .ctl input[type=color] { padding: 0; width: 2rem; height: 1.6rem; }
  .stage { flex: 1; min-height: 0; display: flex; gap: 2rem; align-items: flex-start; }
  .desk { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 30px rgb(0 0 0 / .12); }
  .desk .chrome { display: flex; gap: .4rem; align-items: center; padding: .45rem .7rem; background: var(--chip); border-bottom: 1px solid var(--line); }
  .desk .chrome i { width: .7rem; height: .7rem; border-radius: 50%; background: var(--line); }
  .desk .chrome span { margin-left: .6rem; color: var(--muted); font-size: .8rem; }
  .desk iframe { flex: 1; width: 100%; border: 0; }
  /* phone: a 390x844 viewport (iPhone 14 size) in a bezel; speaker, camera and home bar sit outside the screen */
  .phone { flex: none; position: relative; padding: 40px 12px 30px; border-radius: 50px; background: #111; box-shadow: 0 0 0 2px #3a3a3c, 0 12px 40px rgb(0 0 0 / .3); }
  .phone::before { content: ""; position: absolute; top: 16px; left: 50%; translate: -50% 0; width: 90px; height: 8px; border-radius: 4px; background: #2a2a2c; box-shadow: 64px 0 0 -1px #1d2a3a; } /* speaker and camera in the bezel */
  .phone::after { content: ""; position: absolute; bottom: 11px; left: 50%; translate: -50% 0; width: 120px; height: 5px; border-radius: 3px; background: #48484a; }
  .phone iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 12px; background: #fff; }
  @media (max-width: 60rem) { .desk { display: none; } .stage { justify-content: center; } }
</style>
</head>
<body>
<form class="ctl" id="ctl">
<a class="logo" href="index.html"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M1 5h4v22H1M12.5 5h-4v22h4"/><text x="14.5" y="24">◆</text></svg><span class="name">preview</span></a>
<label>page <select name="page">
<option value="index.html">gallery</option><option value="list.html">list</option><option value="detail.html">detail</option>
<option value="form.html">form</option><option value="settings.html">settings</option><option value="status.html">status (public)</option><option value="login.html">login</option>
</select></label>
<label>design <select name="design"><option value="">plain</option><option value="nordic">nordic</option><option value="ink">ink</option><option value="bw">b/w</option><option value="terminal">terminal</option><option value="modern">modern</option></select></label>
<span class="lab">theme</span> <span class="seg"><label><input type="radio" name="theme" value="" checked>auto</label><label><input type="radio" name="theme" value="light">light</label><label><input type="radio" name="theme" value="dark">dark</label></span>
<label>brand <input type="color" name="brand" value="#0969da"> <button type="button" id="reset" title="design default color">↺</button></label>
<label><input type="checkbox" name="logo"> custom logo</label>
<label><input type="checkbox" name="fit" checked> fit phone to height</label>
</form>
<div class="stage">
<div class="desk"><div class="chrome"><i></i><i></i><i></i><span id="url"></span></div><iframe id="desk" title="desktop"></iframe></div>
<div class="phone" id="phone"><iframe id="mob" title="phone"></iframe></div>
</div>
<script>
{
  const f = document.getElementById('ctl'), desk = document.getElementById('desk'), mob = document.getElementById('mob'), phone = document.getElementById('phone');
  const defaults = {'': '#0969da', nordic: '#3b6e94', ink: '#c2410c', bw: '#000000', terminal: '#b45309', modern: '#4f46e5'};
  const q = new URLSearchParams(location.search);
  let page = q.get('page') || 'index.html', brand = q.get('brand') || '';
  f.design.value = q.get('design') || '';
  f.theme.value = q.get('theme') || '';
  f.logo.checked = q.get('logo') === '1';
  const src = () => {
    const p = new URLSearchParams({design: f.design.value, brand, logo: f.logo.checked ? '1' : ''});
    if (f.theme.value) p.set('theme', f.theme.value);
    return page + (page.includes('?') ? '&' : '?') + p;
  };
  const load = () => {
    f.brand.value = brand || defaults[f.design.value];
    f.page.value = page.split('?')[0];
    desk.src = mob.src = src();
    document.getElementById('url').textContent = page;
    // the preview itself follows the chosen design and theme
    document.documentElement.dataset.design = f.design.value;
    f.theme.value ? document.documentElement.dataset.theme = f.theme.value : delete document.documentElement.dataset.theme;
    const s = new URLSearchParams({page, design: f.design.value, brand, logo: f.logo.checked ? '1' : '', theme: f.theme.value});
    history.replaceState(null, '', '?' + s);
  };
  const fit = () => { // scale the phone down when the window is shorter than the device
    const H = 844 + 70, W = 390 + 24, h = phone.parentElement.clientHeight, k = Math.min(1, h / H);
    phone.style.transform = f.fit.checked && k < 1 ? `scale(${k})` : '';
    phone.style.transformOrigin = 'top center';
    phone.style.marginBottom = f.fit.checked && k < 1 ? `${-H * (1 - k)}px` : '';
    phone.style.marginLeft = phone.style.marginRight = f.fit.checked && k < 1 ? `${-W * (1 - k) / 2}px` : '';
  };
  f.onchange = e => {
    if (e.target.name === 'page') page = f.page.value;
    if (e.target.name === 'design') brand = '';
    if (e.target.name === 'brand') brand = f.brand.value === defaults[f.design.value] ? '' : f.brand.value;
    if (e.target.name === 'fit') return fit();
    load();
  };
  document.getElementById('reset').onclick = () => { brand = ''; load(); };
  f.onsubmit = e => e.preventDefault();
  // a frame navigated (link, shortcut, Esc): move the other frame and the page selector along
  addEventListener('message', e => {
    const p = e.data?.page;
    if (!p || p === page) return;
    page = p;
    const other = e.source === desk.contentWindow ? mob : desk;
    other.src = src();
    f.page.value = page.split('?')[0];
    document.getElementById('url').textContent = page;
    history.replaceState(null, '', '?' + new URLSearchParams({page, design: f.design.value, brand, logo: f.logo.checked ? '1' : '', theme: f.theme.value}));
  });
  addEventListener('resize', fit);
  load();
  fit();
}
</script>
</body>
</html>
