<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · auth</title>
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<div class="app-page narrow"><main id="main"><h1 class="t-title">Sign in</h1><p class="para">Sign in to continue to bill</p> <form class="form" method="post" action="/login"><label class="field"><span class="field-label">E-mail</span><input class="input" name="username" type="email" autocomplete="username" value="peter@nobloat.org" placeholder="anna@example.org" required></label><label class="field"><span class="field-label">Password</span><input class="input" name="password" type="password" autocomplete="current-password" required aria-invalid="true" aria-describedby="password-line"><span class="field-error" id="password-line"><i class="icon-error" aria-hidden="true"></i> Wrong e-mail or password.</span></label><div class="buttons"><button type="submit" class="button primary"><i class="icon-log-in" aria-hidden="true"></i><span>Sign in</span></button></div></form> <p class="para"><a href="forgot.html">Forgot password?</a></p></main></div>
</body>
</html>
