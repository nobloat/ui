<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New password · auth</title>
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<div class="app-page narrow"><main id="main"><h1 class="t-title">New password</h1><form class="form" method="post" action="/reset"><label class="field"><span class="field-label">New password</span><input class="input" name="password" type="password" autocomplete="new-password" required aria-describedby="password-line"><span class="field-hint" id="password-line">at least 12 characters</span></label><label class="field"><span class="field-label">Repeat</span><input class="input" name="again" type="password" autocomplete="new-password" required></label><div class="buttons"><button type="submit" class="button primary"><i class="icon-check" aria-hidden="true"></i><span>Save and sign in</span></button></div></form> <p class="para">You will be signed out on all other devices.</p></main></div>
</body>
</html>
