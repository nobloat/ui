<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New customer · bill</title>
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<div class="app-page"><main id="main"><h1 class="t-title">New customer</h1><form class="form" method="post" action="/customers"><label class="field"><span class="field-label">Name</span><input class="input" name="name" type="text" placeholder="ACME GmbH" required aria-describedby="name-line"><span class="field-hint" id="name-line">as on the invoice</span></label><label class="field"><span class="field-label">E-mail</span><input class="input" name="email" type="email" value="anna@acme" autocomplete="email" aria-invalid="true" aria-describedby="email-line"><span class="field-error" id="email-line"><i class="icon-error" aria-hidden="true"></i> Not an e-mail address <span>e.g. anna@example.org</span></span></label><label class="field"><span class="field-label">VAT id</span><input class="input" name="vat" type="text" placeholder="ATU12345678" pattern="ATU[0-9]{8}" title="ATU and 8 digits, e.g. ATU12345678"></label><div class="buttons"><button type="submit" class="button primary" data-key="Ctrl Enter"><i class="icon-check" aria-hidden="true"></i><span>Create</span><kbd class="kbd">Ctrl Enter</kbd></button><a class="button" href="/customers"><i class="icon-x" aria-hidden="true"></i><span>Cancel</span></a></div></form></main></div>
</body>
</html>
