<div class="settings"{{if .Action}} data-action="{{.Action}}"{{end}}>{{range .Sections}}<section{{if .Danger}} class="danger"{{end}}><header><h2>{{.Title}}</h2>{{if .Text}}<p>{{.Text}}</p>{{end}}{{if .Actions}}<div class="buttons">{{.Actions}}</div>{{end}}</header>{{if .Rows}}<dl class="setting-rows">{{range .Rows}}<div><dt>{{.Label}}</dt><dd>{{.Value}}</dd></div>{{end}}</dl>{{end}}</section>{{end}}</div>
