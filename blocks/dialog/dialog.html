<dialog class="dialog" id="{{.ID}}" aria-labelledby="{{.ID}}-title"><form method="{{if .Action}}post{{else}}dialog{{end}}"{{if .Action}} action="{{.Action}}"{{end}}><header><h2 class="t-subheading" id="{{.ID}}-title">{{.Title}}</h2><button type="button" command="close" commandfor="{{.ID}}" class="button icon-only" aria-label="Close" title="Close (Esc)"><i class="icon-{{.X}}" aria-hidden="true"></i></button></header>{{.Body}}{{if .Actions}}<footer>{{.Actions}}</footer>{{end}}</form></dialog>
