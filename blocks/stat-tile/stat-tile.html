<a class="stat-tile" href="{{.Href}}"><span class="label">{{.Label}}</span><span class="value">{{.Value}}</span>{{if .Delta}}<span class="delta"{{if .State}} data-state="{{.State}}"{{end}}><i class="icon-{{.Icon}}" aria-hidden="true"></i><span>{{.Delta}}</span></span>{{end}}{{if .Points}}<svg class="sparkline" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><polyline points="{{.Points}}"/></svg><span class="period">{{.Period}}</span>{{end}}{{.Meter}}</a>
