<div class="col-track">{{range .}}<section class="column" style="--c:var(--{{.State}})" id="{{.ID}}" aria-label="{{.Name}}"><header><h2><span class="name" title="{{.Name}}">{{.Name}}</span> <span class="count">{{.Count}}</span></h2>{{if .New}}<a class="button icon-only" href="{{.New}}" aria-label="New in {{.Name}}" title="New in {{.Name}}"><i class="icon-{{.Plus}}" aria-hidden="true"></i></a>{{end}}</header><div>{{.Items}}</div></section>{{end}}</div>
