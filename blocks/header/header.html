<header class="app-header"><div><a class="logo" href="{{.Home}}"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M1 5h4v22H1M12.5 5h-4v22h4"/><text x="14.5" y="24">{{.Char}}</text></svg><span>{{.App}}</span></a><div class="end">{{if .Commands}}<button type="button" class="button phone-icon" command="show-modal" commandfor="palette"><i class="icon-{{.Terminal}}" aria-hidden="true"></i><span>Commands</span><kbd class="kbd">Ctrl K</kbd></button>{{end}}{{if .User}}<button type="button" class="user" popovertarget="nb-user" aria-label="{{.Name}}, account menu" title="{{.Name}}"><span class="avatar">{{.Initial}}</span></button><div class="menu" id="nb-user" popover><div class="who"><b>{{.Name}}</b><span>{{.Email}}</span></div><hr><div class="pref"><span>Theme</span>{{.Theme}}</div>{{if .Langs}}<div class="pref"><span>Language</span>{{.Langs}}</div>{{end}}<hr><a href="{{.Settings}}"><i class="icon-{{.Cog}}" aria-hidden="true"></i><span>Settings</span><kbd class="kbd">Ctrl ,</kbd></a><button type="submit" form="nb-signout"><i class="icon-{{.Power}}" aria-hidden="true"></i><span>Sign out</span></button></div><form id="nb-signout" method="post" action="{{.SignOut}}" hidden></form>{{end}}</div></div>{{if .Nav}}<nav class="tab-bar app-nav" aria-label="Places">{{range .Nav}}<a href="{{.Href}}"{{if .On}} aria-current="page"{{end}}><i class="icon-{{.Icon}}" aria-hidden="true"></i><span>{{.Label}}</span>{{if .Badge}}<span class="badge"{{if .BadgeLabel}} aria-label="{{.BadgeLabel}}"{{end}}>{{.Badge}}</span>{{end}}</a>{{end}}</nav>{{end}}</header>
