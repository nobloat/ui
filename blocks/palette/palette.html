<dialog class="dialog command-palette" id="palette" aria-label="Commands"><form method="dialog"><label class="search"><span class="prompt" aria-hidden="true">&gt;_</span><input type="search" name="q" placeholder="Type a command or search" aria-label="Type a command or search" autocomplete="off" role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="palette-list"></label><div class="menu" role="listbox" id="palette-list" aria-label="Commands">{{range .}}<span class="group">{{.Label}}</span>{{range .Items}}{{if .Line}}<hr>{{end}}{{if .Href}}<a href="{{.Href}}"{{if .Danger}} class="danger"{{end}}><i class="icon-{{.Icon}}" aria-hidden="true"></i><span>{{.Label}}</span>{{if .Key}}<kbd class="kbd">{{.Key}}</kbd>{{end}}</a>{{else}}<button type="{{if .Form}}submit{{else}}button{{end}}"{{if .Form}} form="{{.Form}}"{{end}}{{if .Danger}} class="danger"{{end}}><i class="icon-{{.Icon}}" aria-hidden="true"></i><span>{{.Label}}</span>{{if .Key}}<kbd class="kbd">{{.Key}}</kbd>{{end}}</button>{{end}}{{end}}{{end}}<p class="no-match" hidden>No match for <q></q>.</p></div><footer><span><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd>move</span><span><kbd class="kbd">Enter</kbd>select</span><span><kbd class="kbd">Esc</kbd>close</span></footer></form></dialog>
