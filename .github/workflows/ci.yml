name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test                # vet and tests; the browser driver runs in Chrome and Firefox (both on the runner)
      # TODO: make check (Chrome and Firefox) once what it found is fixed (skill/design-system.md → To do → Checks)
      # - run: make check
