name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test ./...            # examples match the partials, i18n keys complete, brand rendering
      - run: node check.mjs           # layout and accessibility on every page, design, theme and width (Chrome is on the runner)
