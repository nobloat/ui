<table class="data-table"><thead><tr>{{range .Columns}}<th{{if .Number}} class="number"{{end}}{{if .Sort}} aria-sort="{{.Sort}}"{{end}}>{{if .Href}}<a href="{{.Href}}">{{.Label}}</a>{{else}}{{.Label}}{{end}}</th>{{end}}</tr></thead><tbody>{{range .Rows}}<tr>{{range .}}<td{{if .Number}} class="number"{{end}}>{{.HTML}}</td>{{end}}</tr>{{end}}</tbody>{{if .Totals}}<tfoot><tr><td colspan="{{.Span}}">{{.Total}}</td>{{range .Totals}}<td{{if .Number}} class="number"{{end}}>{{.HTML}}</td>{{end}}</tr></tfoot>{{end}}</table>
